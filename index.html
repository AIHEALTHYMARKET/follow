const saveCat=()=>db.collection('config').doc('catalog').set({nodes}).catch(e=>toast('儲存失敗：'+e.message));
function rmNode(id){const del=new Set([id]);let ch=true;while(ch){ch=false;nodes.forEach(n=>{if(n.parent&&del.has(n.parent)&&!del.has(n.id)){del.add(n.id);ch=true}})}nodes=nodes.filter(n=>!del.has(n.id));idx()}
function bulk(text){let c=0;for(const line of text.split('\n')){const t=line.trim();if(!t)continue;const[ps,days]=t.split('|'),parts=ps.split(/[>＞›]/).map(s=>s.trim()).filter(Boolean);if(!parts.length)continue;let p=null;
 parts.forEach((nm,i)=>{const last=i===parts.length-1;let n=nodes.find(x=>(x.parent||null)===p&&x.name===nm&&!!x.p===last);if(!n){n={id:uid(),parent:p,name:nm};if(last){n.p=1;n.cycle=+days||30}nodes.push(n);c++}else if(last&&days)n.cycle=+days;p=n.id})}idx();return c}

let pf={cats:[],prods:[],img:''};
const shrink=f=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{let w=Math.min(900,im.width),q=.75,u;const cv=document.createElement('canvas');for(let i=0;i<4;i++){cv.width=w;cv.height=Math.round(im.height*w/im.width);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);u=cv.toDataURL('image/jpeg',q);if(u.length<450000)break;w*=.75;q-=.1}res(u)};im.onerror=rej;im.src=URL.createObjectURL(f)});
const pnamePath=id=>{const a=[];while(id){a.unshift(NM.get(id)?.name||'');id=NM.get(id)?.parent}return a};
const cntUnder=id=>{const n=NM.get(id);return !n?0:n.p?1:kids(id).reduce((t,k)=>t+cntUnder(k.id),0)};
const fuzzy=v=>{const q=v.trim().toLowerCase();if(!q)return[];const T=q.split(/\s+/),pq=q.replace(/\s/g,''),sub=(a,p)=>{let i=0;for(const ch of a){if(ch===p[i])i++;if(i===p.length)return 1}return 0};
 return nodes.filter(n=>n.p).map(n=>{const nm=n.name.toLowerCase(),full=pnamePath(n.id).join(' ').toLowerCase();return{n,sc:nm.includes(q)?0:T.every(t=>full.includes(t))?1:sub(nm,pq)?2:9}}).filter(x=>x.sc<9).sort((a,b)=>a.sc-b.sc||a.n.name.length-b.n.name.length).slice(0,8).map(x=>x.n)};

async function xls(){const X=exCfg(),rows=X.rows,C=X.C;if(!rows.length)return toast('沒有資料可匯出');
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('顧客跟進',{views:[{state:'frozen',ySplit:3,showGridLines:false}]});

 rows.forEach(x=>{const r=ws.addRow(C.map(c=>c.v(x)));r.eachCell((c,k)=>{c.alignment={vertical:'middle',wrapText:true};c.border={bottom:{style:'thin',color:{argb:'FFE9E2D2'}}};if(x.gi%2)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F1E3'}};if(C[k-1].h==='跟進進度')c.font={bold:true,color:{argb:'FF'+rowCol(x)}}})});

async function img(kind){const X=exCfg(),rows=X.rows;if(!rows.length)return toast('沒有資料可匯出');toast('製作中，請稍候…');const C=X.C,ch=[],T=X.T(rows);exT=X.title;for(let i=0;i<rows.length;i+=14)ch.push(rows.slice(i,i+14));
 const box=document.createElement('div');box.style.cssText='position:fixed;left:-99999px;top:0';box.innerHTML=ch.map((r,i)=>page(r,C,i+1,ch.length,T)).join('');document.body.appendChild(box);await document.fonts.ready;
 const cs=[];for(const el of box.children)cs.push(await html2canvas(el,{scale:2,backgroundColor:'#fbf8f1',useCORS:true}));box.remove();
 if(kind==='jpg')cs.forEach((c,i)=>c.toBlob(b=>dl(b,`${X.file}_${i+1}.jpg`),'image/jpeg',.93));
