<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顧客跟進系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--ink:#1b2236;--mut:#8a8f9c;--gold:#b08d4a;--gold2:#e6d3a3;--line:#e9e2d2;--red:#c0483f;--grn:#2f8f6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 'Noto Sans TC',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.brand{font:600 22px 'Cormorant Garamond','Noto Sans TC',serif;letter-spacing:1px;color:var(--gold2)}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
nav a{padding:8px 16px;border-radius:99px;color:var(--mut);cursor:pointer;white-space:nowrap;font-size:14px}nav a.on{background:var(--ink);color:var(--gold2)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 12px rgba(27,34,54,.04)}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button.pri{background:linear-gradient(135deg,#c9a45c,#a98239);color:#fff;border:0}button.ghost{background:transparent;color:#fff;border-color:#fff4}.dg{color:var(--red)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}label.chk{display:inline-flex;gap:4px;margin:0 8px 0 0;align-items:center}
.btns,.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar{margin:0 0 12px}.bar input,.bar select{flex:1;min-width:140px;width:auto}
.ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:#eee;color:#555}.tag.red,.tag.disabled{background:#fbe5e2;color:var(--red)}.tag.gold,.tag.pending{background:#f7edd2;color:#8a6a22}.tag.approved{background:#dff3ea;color:var(--grn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:12px;color:var(--mut)}.st b{display:block;font-size:26px;color:var(--ink)}b.red{color:var(--red)}b.gold{color:var(--gold)}
.chip{display:inline-flex;gap:6px;background:#f7edd2;border-radius:99px;padding:3px 12px;margin:4px 4px 0 0;font-size:13px}.chip a{cursor:pointer;color:var(--red)}
.casc{display:grid;gap:8px}.addrow{display:flex;gap:8px;align-items:center;margin-top:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow{border-bottom:1px solid var(--line);padding:12px 0;display:grid;gap:6px}.fl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:6px;align-items:center;padding:4px 0;flex-wrap:wrap}.sp{flex:1}.ind{margin-left:16px;border-left:2px solid var(--gold2);padding-left:10px}
details.cat>summary{cursor:pointer;padding:6px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}button.sm,.row button,summary button{padding:3px 9px;font-size:12px}
#modal{display:none;position:fixed;inset:0;background:#1b223399;z-index:20;overflow:auto;padding:20px 12px}#modal.on{display:block}
.mbox{max-width:560px;margin:0 auto;background:#fff;border-radius:18px;padding:22px}.mbox h3{margin:0 0 6px;font-family:'Cormorant Garamond','Noto Sans TC';font-size:22px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold2);padding:10px 20px;border-radius:99px;display:none;z-index:30}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#1b2236,#2c3552)}.auth .card{max-width:420px;width:100%;text-align:center}.auth h1{font:600 34px 'Cormorant Garamond','Noto Sans TC';margin:0}
.rp{width:1123px;min-height:794px;background:#fbf8f1;padding:44px 48px;font-family:'Noto Sans TC',sans-serif;color:#1b2236;position:relative}
.rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b08d4a;padding-bottom:16px;margin-bottom:22px}.rt{font:600 34px 'Cormorant Garamond','Noto Sans TC'}.rs{color:#b08d4a;font-size:14px}
.rp table{width:100%;border-collapse:collapse}.rp th{background:#1b2236;color:#e6d3a3;font-size:13px;padding:10px 8px;text-align:left}.rp td{font-size:13px;padding:10px 8px;border-bottom:1px solid #e9e2d2;vertical-align:top}.rp tr:nth-child(even) td{background:#f3ecdc}.rf{position:absolute;bottom:20px;right:48px;color:#8a8f9c;font-size:12px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div><div id="modal"><div class="mbox" id="mbox"></div></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ===== ===== */
const FB={apiKey:"AIzaSyAj2yhiiVg07faOhPVNYIrnzmXobrm8_xo",authDomain:"follow-2041f.firebaseapp.com",projectId:"follow-2041f",appId:"1:577807614922:web:a067e166e19baae7ae0533"};
const ADMIN_EMAIL="diabolo.weien@gmail.com";
/* ========================= */
firebase.initializeApp(FB);const auth=firebase.auth(),db=firebase.firestore();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CH={whatsapp:'WhatsApp',email:'Email',telegram:'Telegram',messenger:'Facebook Messenger',instagram:'Instagram'};
const TYPES={text:'文字',textarea:'長文字',number:'數字',date:'日期',select:'下拉選單',channel:'聯絡管道',items:'產品與數量',member:'會員資訊'};
const ST={pending:'待審核',approved:'已批准',disabled:'已停用'};
const DEF_FIELDS=[
{id:'name',label:'顧客姓名',type:'text',req:1,on:1,core:1},{id:'callName',label:'你對顧客的稱呼',type:'text',req:1,on:1,core:1},
{id:'channel',label:'顧客聯絡管道',type:'channel',req:1,on:1,core:1},{id:'account',label:'帳號 / 連結',type:'text',req:1,on:1,core:1},
{id:'purchaseDate',label:'購買日期',type:'date',req:1,on:1,core:1},{id:'habit',label:'顧客購買習慣',type:'select',options:['親送','顧客自訂','幫顧客郵寄'],req:1,on:1},
{id:'items',label:'購買產品與數量',type:'items',req:1,on:1,core:1},{id:'member',label:'是否是會員',type:'member',req:1,on:1,core:1}];
const DEF_CFG={ahead:3,renewDays:365,renewAhead:30,
tpl:'Hi {稱呼}～我是{下線} 😊\n上次您購買的{產品}，算一算差不多快用完了。最近使用的感覺如何呢？需要我幫您安排補貨嗎？',
tplRenew:'Hi {稱呼}～我是{下線} 😊\n您的會員資格快到續約時間了，想先跟您確認，需要我協助辦理續約嗎？'};
let me,isAdmin,fields=[],nodes=[],NM=new Map(),cfg={},custs=[],users=[],tab='home',filterUid='all',q='',items=[],path=[],notified=0;const open=new Set();
const idx=()=>NM=new Map(nodes.map(n=>[n.id,n])),kids=p=>nodes.filter(n=>(n.parent||null)===p),uid=()=>'n'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((new Date(s+'T00:00:00')-new Date(ymd(new Date())+'T00:00:00'))/864e5);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)};
const openModal=h=>{$('#mbox').innerHTML=h;$('#modal').classList.add('on')},closeModal=()=>$('#modal').classList.remove('on');
const ask=(t,v='')=>new Promise(r=>{openModal(`<h3>${t}</h3><input id="ask" value="${esc(v)}"><div class="btns"><button class="pri" id="ok">確定</button><button data-a="close">取消</button></div>`);$('#ask').focus();const go=()=>{const x=$('#ask').value.trim();closeModal();r(x||null)};$('#ok').onclick=go;$('#ask').onkeydown=e=>e.key==='Enter'&&go()});
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)};

/* ---------- 登入流程 ---------- */
auth.onAuthStateChanged(async u=>{
 if(!u)return $('#app').innerHTML=`<div class="auth"><div class="card"><h1>◆ 顧客跟進</h1><p class="mut">請使用 Gmail 登入<br>首次使用需經管理員批准</p><button class="pri" data-a="login" style="width:100%;padding:12px">使用 Google 登入</button></div></div>`;
 isAdmin=u.email===ADMIN_EMAIL;const ref=db.collection('users').doc(u.uid);let s=await ref.get();
 if(!s.exists){if(isAdmin){await ref.set({email:u.email,realName:'管理員',memberNo:'ADMIN',status:'approved',role:'admin',at:Date.now()});s=await ref.get()}else return regView(u)}
 me={uid:u.uid,...s.data()};
 if(me.status!=='approved'&&!isAdmin){$('#app').innerHTML=`<div class="auth"><div class="card"><h2>${me.status==='disabled'?'此帳號已被停用':'等待管理員批准中'}</h2><p class="mut">${esc(u.email)}<br>${me.status==='disabled'?'如有疑問請聯絡你的上線':'批准後會自動進入系統'}</p><button data-a="out">登出</button></div></div>`;
  return ref.onSnapshot(x=>{if(x.data()?.status==='approved')location.reload()})}
 await start()});
function regView(u){$('#app').innerHTML=`<div class="auth"><div class="card" style="text-align:left"><h2>註冊申請</h2><p class="mut">送出後需等待管理員批准。</p><label>會員編號</label><input id="rno"><label>真實姓名</label><input id="rnm"><label>Email</label><input value="${esc(u.email)}" readonly><div class="btns"><button class="pri" id="rgo">送出申請</button><button data-a="out">登出</button></div></div></div>`;
 $('#rgo').onclick=async()=>{const memberNo=$('#rno').value.trim(),realName=$('#rnm').value.trim();if(!memberNo||!realName)return toast('請填寫完整');await db.collection('users').doc(u.uid).set({email:u.email,realName,memberNo,status:'pending',role:'user',at:Date.now()});location.reload()}}
async function start(){
 const g=n=>db.collection('config').doc(n).get(),[a,b,c]=await Promise.all([g('fields'),g('catalog'),g('settings')]);
 fields=a.exists?a.data().list:JSON.parse(JSON.stringify(DEF_FIELDS));nodes=b.exists?b.data().nodes:[];idx();cfg={...DEF_CFG,...(c.exists?c.data():{})};
 const tabs=[['home','提醒'],['cust','顧客']].concat(isAdmin?[['mem','成員審核'],['fld','欄位設定'],['cat','產品目錄'],['set','系統設定']]:[]);
 $('#app').innerHTML=`<header><span class="brand">◆ 顧客跟進</span><span>${esc(me.realName)}${isAdmin?' · 管理員':''} <button class="ghost" data-a="out">登出</button></span></header><nav>${tabs.map(t=>`<a data-a="tab" data-id="${t[0]}">${t[1]}</a>`).join('')}</nav><main id="main"></main>`;
 const base=db.collection('customers'),qy=isAdmin?base:base.where('ownerUid','==',me.uid);
 qy.onSnapshot(s=>{custs=s.docs.map(d=>({id:d.id,...d.data()}));if((tab==='home'||tab==='cust')&&!$('#modal').classList.contains('on'))draw();if(!notified){notified=1;notify()}},e=>toast('讀取失敗：'+e.message));
 if(isAdmin)db.collection('users').onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='mem')draw()});
 draw()}
const draw=()=>{document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===tab));({home:homeView,cust:custView,mem:memView,fld:fldView,cat:catView,set:setView})[tab]()};

/* ---------- 跟進計算 ---------- */
const cycleOf=i=>NM.get(i.id)?.cycle??i.cycle;
function dues(c){const r=[],it=(c.d.items||[]).filter(i=>cycleOf(i)>0),base=c.base||c.d.purchaseDate;
 if(it.length&&base)r.push({c,date:it.map(i=>addDays(base,+cycleOf(i))).sort()[0],kind:'follow'});
 const m=c.d.member;if(m&&m.is&&m.join)r.push({c,date:addDays(m.join,+cfg.renewDays),kind:'renew'});return r}
const myList=()=>custs.filter(c=>filterUid==='all'||c.ownerUid===filterUid);
const rems=()=>myList().flatMap(dues).map(r=>({...r,df:diff(r.date)})).filter(r=>r.df<=(r.kind==='renew'?cfg.renewAhead:cfg.ahead)).sort((a,b)=>a.df-b.df);
const when=n=>n<0?`逾期 ${-n} 天`:n===0?'今天':`還有 ${n} 天`,cls=n=>n<0?'red':n<=cfg.ahead?'gold':'';
function notify(){const n=rems().filter(r=>r.df<=0).length;if(n&&'Notification'in window&&Notification.permission==='granted')new Notification('顧客跟進提醒',{body:`有 ${n} 位顧客需要跟進`})}
function msg(c,kind){const base=c.base||c.d.purchaseDate,all=c.d.items||[],due=all.filter(i=>cycleOf(i)>0&&base&&diff(addDays(base,+cycleOf(i)))<=cfg.ahead),p=(due.length?due:all).map(i=>i.name).join('、');
 return (kind==='renew'?cfg.tplRenew:cfg.tpl).replaceAll('{稱呼}',c.d.callName||c.d.name||'').replaceAll('{顧客}',c.d.name||'').replaceAll('{產品}',p).replaceAll('{下線}',c.ownerName||'')}
function link(ch,acc,text){acc=(acc||'').trim();const T=encodeURIComponent(text),u=acc.replace(/^@/,'');
 if(ch==='whatsapp')return'https://wa.me/'+acc.replace(/\D/g,'')+'?text='+T;
 if(/^https?:\/\//i.test(acc))return acc;
 if(ch==='email')return'mailto:'+acc+'?subject='+encodeURIComponent('關心您的使用狀況')+'&body='+T;
 if(ch==='telegram')return /^\+?\d+$/.test(u)?'https://t.me/+'+u.replace(/\D/g,''):'https://t.me/'+u;
 if(ch==='messenger')return'https://m.me/'+u;return'https://ig.me/m/'+u}
const calURL=r=>'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent((r.kind==='renew'?'會員續約：':'跟進：')+r.c.d.name)+'&dates='+r.date.replace(/-/g,'')+'/'+addDays(r.date,1).replace(/-/g,'')+'&details='+encodeURIComponent(location.href);

/* ---------- 提醒頁 / 顧客頁 ---------- */
const fsel=()=>isAdmin?`<select id="flt"><option value="all">全部下線</option>${users.filter(u=>u.status==='approved').map(u=>`<option value="${u.id}" ${filterUid===u.id?'selected':''}>${esc(u.realName)}（${esc(u.memberNo)}）</option>`).join('')}</select>`:'';
const remCard=r=>`<div class="card"><div class="ch"><b>${esc(r.c.d.name)}</b><span class="tag ${cls(r.df)}">${r.kind==='renew'?'會員續約':'產品跟進'} · ${when(r.df)}</span></div><div class="mut">${r.date}${isAdmin?' · 填寫者 '+esc(r.c.ownerName):''}</div><div class="btns"><button class="pri" data-a="fu" data-id="${r.c.id}" data-k="${r.kind}">立即跟進</button><a class="btn" href="${calURL(r)}" target="_blank">📅 加入日曆提醒</a></div></div>`;
function homeView(){const R=rems(),o=R.filter(r=>r.df<0).length,t=R.filter(r=>r.df===0).length;
 $('#main').innerHTML=(isAdmin?`<div class="bar">${fsel()}</div>`:'')+`<div class="stats"><div class="st"><b class="red">${o}</b>逾期</div><div class="st"><b class="gold">${t}</b>今天</div><div class="st"><b>${R.length-o-t}</b>即將到期</div><div class="st"><b>${myList().length}</b>顧客總數</div></div>`
 +(('Notification' in window&&Notification.permission==='default')?`<div class="card">🔔 <button class="pri" data-a="notif">開啟瀏覽器提醒</button></div>`:'')
 +(R.length?R.map(remCard).join(''):'<div class="card" style="text-align:center;color:var(--mut)">目前沒有需要跟進的顧客 ✨</div>')}
function custView(){$('#main').innerHTML=`<div class="bar">${fsel()}<input id="sq" placeholder="搜尋姓名 / 產品" value="${esc(q)}"><button class="pri" data-a="new">＋ 新增顧客</button></div><div class="bar"><button data-a="xls">📊 匯出 Excel</button><button data-a="pdf">📄 匯出 PDF</button><button data-a="jpg">🖼 匯出 JPG</button></div><div id="list"></div>`;drawList()}
const nextOf=c=>dues(c).find(r=>r.kind==='follow')?.date||'';
function list(){const k=q.toLowerCase();return myList().filter(c=>!k||(c.d.name||'').toLowerCase().includes(k)||(c.d.items||[]).some(i=>i.name.toLowerCase().includes(k))).sort((a,b)=>(nextOf(a)||'9').localeCompare(nextOf(b)||'9'))}
function drawList(){const L=list();$('#list').innerHTML=L.map(c=>{const n=nextOf(c),m=c.d.member;return`<div class="card"><div class="ch"><b>${esc(c.d.name)}</b><span class="tag">${CH[c.d.channel]||''}</span>${m&&m.is?'<span class="tag gold">會員</span>':''}</div>
 <div class="mut">稱呼：${esc(c.d.callName)} · 購買日 ${esc(c.d.purchaseDate)}${isAdmin?' · 填寫者 '+esc(c.ownerName):''}</div><div>${(c.d.items||[]).map(i=>`<span class="chip">${esc(i.name)} ×${i.qty}</span>`).join('')}</div>
 ${n?`<div style="margin-top:6px">下次跟進：${n} <span class="tag ${cls(diff(n))}">${when(diff(n))}</span></div>`:''}
 <div class="btns"><button class="pri" data-a="fu" data-id="${c.id}" data-k="follow">跟進</button><button data-a="ed" data-id="${c.id}">編輯</button><button class="dg" data-a="rm" data-id="${c.id}">刪除</button></div></div>`}).join('')||'<p class="mut" style="text-align:center">還沒有顧客資料</p>'}

/* ---------- 跟進視窗 ---------- */
function fu(id,kind){const c=custs.find(x=>x.id===id);
 openModal(`<h3>跟進 ${esc(c.d.name)}</h3><label>平台</label><select id="fch">${chOpts(c.d.channel)}</select><label>帳號 / 連結</label><input id="fac" value="${esc(c.d.account)}"><label>跟進文案（可直接修改）</label><textarea id="fmsg" rows="6">${esc(msg(c,kind))}</textarea>
 <div class="btns"><button class="pri" id="fgo">複製文案並前往平台</button><button id="fdone">${kind==='renew'?'已續約':'已跟進（重新計時）'}</button></div><p class="mut">WhatsApp、Email 會自動帶入文案；其他平台文案已複製，進入對話後貼上再按發送即可。</p>`);
 $('#fgo').onclick=()=>{const t=$('#fmsg').value;navigator.clipboard?.writeText(t);window.open(link($('#fch').value,$('#fac').value,t),'_blank')};
 $('#fdone').onclick=async()=>{const t=ymd(new Date());await db.collection('customers').doc(id).update(kind==='renew'?{'d.member.join':t}:{base:t,lastFollow:t});closeModal();toast('已記錄')}}
const chOpts=v=>Object.entries(CH).map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('');

/* ---------- 顧客表單（依後台欄位設定產生） ---------- */
function fieldHTML(f,d){const v=d[f.id],L=`<label>${esc(f.label)}${f.req?' <i style="color:var(--red)">*</i>':''}</label>`;
 if(f.type==='items')return L+'<div id="itemsBox"></div>';
 if(f.type==='member'){const m=v||{};return L+`<select id="m_is"><option value="">請選擇</option><option value="1" ${m.is===true?'selected':''}>是</option><option value="0" ${m.is===false?'selected':''}>否</option></select><div id="m_more" style="display:${m.is?'block':'none'}"><div class="g2"><div><label>會員編號 *</label><input id="m_no" value="${esc(m.no)}"></div><div><label>加入日期 *</label><input type="date" id="m_join" value="${esc(m.join)}"></div></div></div>`}
 if(f.type==='select')return L+`<select data-f="${f.id}"><option value="">請選擇</option>${(f.options||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 if(f.type==='channel')return L+`<select data-f="${f.id}">${chOpts(v)}</select>`;
 if(f.type==='textarea')return L+`<textarea data-f="${f.id}" rows="3">${esc(v)}</textarea>`;
 return L+`<input data-f="${f.id}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" value="${esc(v)}" ${f.id==='account'?'placeholder="電話（含國碼）/ 用戶名 / 連結"':''}>`}
function cform(id){const c=id?custs.find(x=>x.id===id):null,d=c?c.d:{};items=(d.items||[]).map(x=>({...x}));path=[];
 openModal(`<h3>${c?'編輯顧客':'新增顧客'}</h3>${fields.filter(f=>f.on).map(f=>fieldHTML(f,d)).join('')}<div class="btns"><button class="pri" id="csave" data-a="csave" data-id="${id||''}">儲存</button><button data-a="close">取消</button></div>`);itemsUI()}
function chain(id){const a=[];while(id){a.unshift(id);id=NM.get(id).parent||null}return a}
function itemsUI(){const b=$('#itemsBox');if(!b)return;let h='<div class="casc">',p=null;
 for(let i=0;;i++){const k=kids(p);if(!k.length)break;
  h+=`<select data-lv="${i}"><option value="">${i?'再選下一層…':'選擇大類別…'}</option>${k.map(n=>`<option value="${n.id}" ${path[i]===n.id?'selected':''}>${esc(n.name)}${n.p?'':'  ›'}</option>`).join('')}</select>`;
  const cur=path[i];if(!cur)break;const n=NM.get(cur);if(n.p)break;p=cur}
 h+=`</div><input list="plist" id="psearch" placeholder="或直接輸入產品名稱搜尋" style="margin-top:8px"><datalist id="plist">${nodes.filter(n=>n.p).map(n=>`<option value="${esc(n.name)}">`).join('')}</datalist>`;
 const last=NM.get(path[path.length-1]);
 if(last&&last.p)h+=`<div class="addrow"><b>${esc(last.name)}</b><input type="number" id="pq" value="1" min="1" style="width:80px"><button class="pri" data-a="padd">加入</button></div>`;
 h+=`<div>${items.map((it,i)=>`<span class="chip">${esc(it.name)} ×${it.qty}<a data-a="pdel" data-id="${i}">✕</a></span>`).join('')}</div>`;b.innerHTML=h}
function pushPending(){const last=NM.get(path[path.length-1]);if(last&&last.p&&$('#pq')){items.push({id:last.id,name:last.name,qty:Math.max(1,+$('#pq').value||1),cycle:last.cycle});path=[]}}
function readForm(){const d={},err=[];
 for(const f of fields.filter(f=>f.on)){let v;
  if(f.type==='items'){pushPending();v=items.slice();if(f.req&&!v.length)err.push(f.label)}
  else if(f.type==='member'){const s=$('#m_is').value;if(s==='1'){v={is:true,no:$('#m_no').value.trim(),join:$('#m_join').value};if(!v.no||!v.join)err.push('會員編號 / 加入日期')}else{v={is:false};if(f.req&&s==='')err.push(f.label)}}
  else{v=$(`[data-f="${f.id}"]`).value.trim();if(f.req&&!v)err.push(f.label)}
  d[f.id]=v}
 return{d,err}}
async function saveC(id){const{d,err}=readForm();if(err.length)return toast('請填寫：'+err.join('、'));const btn=$('#csave');btn.disabled=true;
 try{if(id){const c=custs.find(x=>x.id===id),u={d};if(d.purchaseDate&&d.purchaseDate!==c.d.purchaseDate)u.base=d.purchaseDate;await db.collection('customers').doc(id).update(u)}
  else await db.collection('customers').add({ownerUid:me.uid,ownerName:me.realName,ownerNo:me.memberNo,d,base:d.purchaseDate||ymd(new Date()),at:Date.now()});
  closeModal();toast('已儲存')}catch(e){toast('儲存失敗：'+e.message);btn.disabled=false}}

/* ---------- 管理員：成員 ---------- */
function memView(){const L=[...users].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
 $('#main').innerHTML=L.map(u=>`<div class="card"><div class="ch"><b>${esc(u.realName)}</b><span class="tag ${u.status}">${ST[u.status]}</span></div><div class="mut">會員編號 ${esc(u.memberNo)} · ${esc(u.email)}</div>${u.email===ADMIN_EMAIL?'':`<div class="btns">${u.status!=='approved'?`<button class="pri" data-a="st" data-v="approved" data-id="${u.id}">批准</button>`:`<button class="dg" data-a="st" data-v="disabled" data-id="${u.id}">停用</button>`}<button class="dg" data-a="udel" data-id="${u.id}">刪除</button></div>`}</div>`).join('')||'<p class="mut">尚無成員</p>'}

/* ---------- 管理員：欄位設定 ---------- */
function fldView(){$('#main').innerHTML=`<div class="card"><h3>填寫欄位設定</h3><p class="mut">「顯示」＝讓下線看到；「必填」＝不填不能儲存。可改名稱、調順序、新增自訂欄位。</p>${fields.map((f,i)=>`<div class="frow" data-i="${i}"><input data-k="label" value="${esc(f.label)}"><div class="fl"><label class="chk"><input type="checkbox" data-k="on" ${f.on?'checked':''}>顯示</label><label class="chk"><input type="checkbox" data-k="req" ${f.req?'checked':''}>必填</label><button data-a="fup">↑</button><button data-a="fdn">↓</button>${f.core?'':'<button class="dg" data-a="fdel">刪除</button>'}<span class="mut">類型：${TYPES[f.type]}</span></div>${f.type==='select'?`<input data-k="options" placeholder="選項，用逗號分隔" value="${esc((f.options||[]).join(','))}">`:''}</div>`).join('')}
 <div class="btns"><select id="ntype" style="width:auto">${['text','textarea','number','date','select'].map(t=>`<option value="${t}">${TYPES[t]}</option>`).join('')}</select><button data-a="fadd">＋ 新增欄位</button><button class="pri" data-a="fsave">儲存設定</button></div></div>`}

/* ---------- 管理員：產品目錄 ---------- */
function treeHTML(p){return kids(p).map(n=>n.p?`<div class="row"><span>🏷 ${esc(n.name)}</span><span class="sp"></span><span class="mut">週期</span><input type="number" min="1" value="${n.cycle||30}" data-cy="${n.id}" style="width:70px;padding:4px 8px"><span class="mut">天</span><button data-a="ren" data-id="${n.id}">改名</button><button class="dg" data-a="del" data-id="${n.id}">刪</button></div>`
 :`<details class="cat" data-id="${n.id}" ${open.has(n.id)?'open':''}><summary>📁 <b>${esc(n.name)}</b><span class="sp"></span><button data-a="cadd" data-id="${n.id}">＋類別</button><button data-a="padd2" data-id="${n.id}">＋產品</button><button data-a="ren" data-id="${n.id}">改名</button><button class="dg" data-a="del" data-id="${n.id}">刪</button></summary><div class="ind">${treeHTML(n.id)}</div></details>`).join('')}
function catView(){$('#main').innerHTML=`<div class="card"><h3>產品目錄（共 ${nodes.filter(n=>n.p).length} 項產品）</h3><p class="mut">類別可以 2～5 層，最後一層放產品並設定跟進週期（天）。修改後自動儲存，下線端立即更新。</p><div class="btns"><button class="pri" data-a="cadd" data-id="">＋ 大類別</button></div></div>
 <div class="card"><details><summary><b>📥 批量匯入（400 項建議用這個）</b></summary><p class="mut">每行一項：<br>類別&gt;類別&gt;產品名稱|週期天數<br>例：營養補充&gt;運動營養&gt;XS muscle|30<br>不存在的類別會自動建立；產品名稱已存在則更新週期。</p><textarea id="bulk" rows="8" placeholder="營養補充>運動營養>XS muscle|30"></textarea><div class="btns"><button class="pri" data-a="bulk">匯入</button></div></details></div><div class="card">${treeHTML(null)||'<span class="mut">尚未建立任何類別</span>'}</div>`}
const saveCat=()=>db.collection('config').doc('catalog').set({nodes}).catch(e=>toast('儲存失敗：'+e.message));
function rmNode(id){const del=new Set([id]);let ch=true;while(ch){ch=false;nodes.forEach(n=>{if(n.parent&&del.has(n.parent)&&!del.has(n.id)){del.add(n.id);ch=true}})}nodes=nodes.filter(n=>!del.has(n.id));idx()}
function bulk(text){let c=0;for(const line of text.split('\n')){const t=line.trim();if(!t)continue;const[ps,days]=t.split('|'),parts=ps.split(/[>＞›]/).map(s=>s.trim()).filter(Boolean);if(!parts.length)continue;let p=null;
 parts.forEach((nm,i)=>{const last=i===parts.length-1;let n=nodes.find(x=>(x.parent||null)===p&&x.name===nm&&!!x.p===last);if(!n){n={id:uid(),parent:p,name:nm};if(last){n.p=1;n.cycle=+days||30}nodes.push(n);c++}else if(last&&days)n.cycle=+days;p=n.id})}idx();return c}

/* ---------- 管理員：系統設定 ---------- */
function setView(){$('#main').innerHTML=`<div class="card"><h3>系統設定</h3><label>產品跟進：到期前幾天開始提醒</label><input id="s_ahead" type="number" value="${cfg.ahead}"><label>會員續約週期（天）</label><input id="s_rd" type="number" value="${cfg.renewDays}"><label>續約：到期前幾天開始提醒</label><input id="s_ra" type="number" value="${cfg.renewAhead}">
 <label>產品跟進文案（可用 {稱呼} {顧客} {產品} {下線}）</label><textarea id="s_tpl" rows="4">${esc(cfg.tpl)}</textarea><label>續約文案</label><textarea id="s_tr" rows="4">${esc(cfg.tplRenew)}</textarea><div class="btns"><button class="pri" data-a="sset">儲存</button></div></div>`}

/* ---------- 匯出 ---------- */
const who=()=>isAdmin?(filterUid==='all'?'全部下線':(users.find(u=>u.id===filterUid)?.realName||'')):me.realName;
function cell(c,f){const v=c.d[f.id];if(f.type==='items')return(v||[]).map(i=>i.name+' ×'+i.qty).join('、');if(f.type==='member')return v&&v.is?`會員 ${v.no}（${v.join} 加入）`:'非會員';if(f.type==='channel')return CH[v]||v||'';return v??''}
function cols(){const C=fields.filter(f=>f.on).map(f=>({h:f.label,v:x=>cell(x,f)}));C.push({h:'下次跟進',v:x=>nextOf(x)||'-'});if(isAdmin)C.unshift({h:'填寫者',v:x=>x.ownerName});return C}
async function xls(){const rows=list(),C=cols();if(!rows.length)return toast('沒有資料可匯出');
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('顧客跟進',{views:[{state:'frozen',ySplit:3,showGridLines:false}]});
 ws.mergeCells(1,1,1,C.length);Object.assign(ws.getCell(1,1),{value:'顧客跟進報表'});ws.getCell(1,1).font={name:'Microsoft JhengHei',size:18,bold:true,color:{argb:'FF1B2236'}};ws.getRow(1).height=34;
 ws.mergeCells(2,1,2,C.length);ws.getCell(2,1).value=`${who()}　｜　匯出日期 ${ymd(new Date())}　｜　共 ${rows.length} 位顧客`;ws.getCell(2,1).font={color:{argb:'FFB08D4A'},size:11};
 const hr=ws.addRow(C.map(c=>c.h));hr.height=26;hr.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1B2236'}};c.font={bold:true,color:{argb:'FFE6D3A3'}};c.alignment={vertical:'middle',horizontal:'center'}});
 rows.forEach((x,i)=>{const r=ws.addRow(C.map(c=>c.v(x)));r.eachCell(c=>{c.alignment={vertical:'middle',wrapText:true};c.border={bottom:{style:'thin',color:{argb:'FFE9E2D2'}}};if(i%2)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F1E3'}}})});
 C.forEach((c,i)=>ws.getColumn(i+1).width=Math.min(42,Math.max(12,...rows.map(x=>String(c.v(x)).length*1.8+2))));
 dl(new Blob([await wb.xlsx.writeBuffer()]),'顧客跟進.xlsx')}
const page=(rows,C,i,n)=>`<div class="rp"><div class="rh"><div><div class="rt">顧客跟進報表</div><div class="rs">${esc(who())}　·　${ymd(new Date())}　·　共 ${list().length} 位顧客</div></div><div class="rt" style="color:#b08d4a">◆</div></div><table><thead><tr>${C.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr>${C.map(c=>`<td>${esc(c.v(x))}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="rf">第 ${i} / ${n} 頁</div></div>`;
async function img(kind){const rows=list();if(!rows.length)return toast('沒有資料可匯出');toast('製作中，請稍候…');const C=cols(),ch=[];for(let i=0;i<rows.length;i+=9)ch.push(rows.slice(i,i+9));
 const box=document.createElement('div');box.style.cssText='position:fixed;left:-99999px;top:0';box.innerHTML=ch.map((r,i)=>page(r,C,i+1,ch.length)).join('');document.body.appendChild(box);await document.fonts.ready;
 const cs=[];for(const el of box.children)cs.push(await html2canvas(el,{scale:2,backgroundColor:'#fbf8f1',useCORS:true}));box.remove();
 if(kind==='jpg')cs.forEach((c,i)=>c.toBlob(b=>dl(b,`顧客跟進_${i+1}.jpg`),'image/jpeg',.93));
 else{let pdf;cs.forEach(c=>{const h=c.height/c.width*297,o=h>297?'p':'l';if(!pdf)pdf=new jspdf.jsPDF({orientation:o,unit:'mm',format:[297,h]});else pdf.addPage([297,h],o);pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',0,0,297,h)});pdf.save('顧客跟進.pdf')}}

/* ---------- 全域事件 ---------- */
document.addEventListener('click',async e=>{
 if(e.target.id==='modal')return closeModal();
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;if(t.closest('summary'))e.preventDefault();
 const fcfg=()=>db.collection('config').doc('fields').set({list:fields}).then(()=>toast('已儲存')).catch(x=>toast('失敗：'+x.message));
 if(a==='login')return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(x=>toast(x.message));
 if(a==='out'){await auth.signOut();return location.reload()}
 if(a==='tab'){tab=id;return draw()}
 if(a==='close')return closeModal();
 if(a==='notif'){await Notification.requestPermission();return draw()}
 if(a==='fu')return fu(id,t.dataset.k);
 if(a==='new')return cform();if(a==='ed')return cform(id);
 if(a==='rm'){if(confirm('確定刪除這位顧客？'))db.collection('customers').doc(id).delete();return}
 if(a==='csave')return saveC(id);
 if(a==='padd'){pushPending();return itemsUI()}
 if(a==='pdel'){items.splice(+id,1);return itemsUI()}
 if(a==='xls')return xls();if(a==='pdf'||a==='jpg')return img(a);
 if(a==='st'){return db.collection('users').doc(id).update({status:t.dataset.v})}
 if(a==='udel'){if(confirm('刪除後該成員需重新申請，確定？'))db.collection('users').doc(id).delete();return}
 if(a==='fup'||a==='fdn'){const i=+t.closest('.frow').dataset.i,j=a==='fup'?i-1:i+1;if(j<0||j>=fields.length)return;[fields[i],fields[j]]=[fields[j],fields[i]];return fldView()}
 if(a==='fdel'){if(confirm('刪除此欄位？舊資料仍保留。')){fields.splice(+t.closest('.frow').dataset.i,1);fldView()}return}
 if(a==='fadd'){const l=await ask('新欄位名稱');if(!l)return;const ty=$('#ntype')?.value||'text',f={id:'f'+uid(),label:l,type:ty,req:0,on:1};if(ty==='select')f.options=[];fields.push(f);return fldView()}
 if(a==='fsave')return fcfg();
 if(a==='cadd'){const n=await ask('類別名稱');if(!n)return;nodes.push({id:uid(),parent:id||null,name:n});if(id)open.add(id);saveCat();return catView()}
 if(a==='padd2'){const n=await ask('產品名稱');if(!n)return;const d=await ask('跟進週期（天）','30');nodes.push({id:uid(),parent:id,name:n,p:1,cycle:+d||30});idx();open.add(id);saveCat();return catView()}
 if(a==='ren'){const n=NM.get(id),v=await ask('新名稱',n.name);if(v){n.name=v;saveCat();catView()}return}
 if(a==='del'){if(confirm('刪除後其下所有項目也會一併刪除，確定？')){rmNode(id);saveCat();catView()}return}
 if(a==='bulk'){const c=bulk($('#bulk').value);saveCat();toast(`已新增 ${c} 個項目`);return catView()}
 if(a==='sset'){cfg={ahead:+$('#s_ahead').value||3,renewDays:+$('#s_rd').value||365,renewAhead:+$('#s_ra').value||30,tpl:$('#s_tpl').value,tplRenew:$('#s_tr').value};db.collection('config').doc('settings').set(cfg).then(()=>toast('已儲存'))}
});
document.addEventListener('toggle',e=>{const id=e.target.dataset?.id;if(id&&e.target.tagName==='DETAILS')e.target.open?open.add(id):open.delete(id)},true);
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='sq'){q=t.value;drawList()}
 if(t.id==='psearch'){const n=nodes.find(n=>n.p&&n.name.toLowerCase()===t.value.trim().toLowerCase());if(n){path=chain(n.id);itemsUI()}}
 const row=t.closest?.('.frow');if(row&&t.dataset.k){const f=fields[+row.dataset.i],k=t.dataset.k;f[k]=k==='options'?t.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean):t.type==='checkbox'?(t.checked?1:0):t.value}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='flt'){filterUid=t.value;draw()}
 if(t.dataset.lv!==undefined){path=path.slice(0,+t.dataset.lv);if(t.value)path.push(t.value);itemsUI()}
 if(t.id==='m_is')$('#m_more').style.display=t.value==='1'?'block':'none';
 if(t.dataset.cy){NM.get(t.dataset.cy).cycle=+t.value||30;saveCat()}});
</script></body></html>
