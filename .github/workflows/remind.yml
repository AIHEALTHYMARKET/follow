name: daily-reminder
on:
  schedule:
    - cron: '7 1,7,12 * * *'   # UTC 01:07 / 07:07 / 12:07 = 馬來西亞 09:07（Email＋推播）、15:07、20:07（推播）。避開整點，GitHub 較不會漏跑
  workflow_dispatch:
    inputs:
      test:
        description: '只發送測試手機推播（不寄 Email）'
        type: boolean
        default: false
      title:
        description: '手動推播標題（可留空）'
        type: string
        default: ''
      body:
        description: '手動推播內容（填寫後只推播這則訊息，不寄 Email）'
        type: string
        default: ''
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/remind.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BROADCAST_TITLE: ${{ inputs.title }}
          BROADCAST_BODY: ${{ inputs.body }}
          TEST_PUSH: ${{ inputs.test && '1' || '' }}
